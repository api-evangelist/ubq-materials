aid: ubq-materials
name: UBQ Materials
description: UBQ Materials is a climate-tech company founded in 2012 that converts
  unsorted mixed household waste, including organics and hard-to-recycle plastics,
  into UBQ, a climate-positive thermoplastic material that substitutes for oil-based
  plastics in manufacturing. A Certified B Corporation backed by Battery Ventures,
  the company operates a full-scale production facility in Bergen op Zoom, Netherlands
  (opened 2024) with 80,000 tons of annual capacity, plus an R&D center in Tze'elim,
  Israel. UBQ Materials publishes no public API or developer surface.
